name: Build Minecraft Add-On
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  road-car-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("packs").rglob("*.json")):
              json.load(p.open(encoding="utf-8"))
              print("JSON OK",p)
          json.load(open("spec/anticipations.json",encoding="utf-8"))
          json.load(open("spec/requirements.json",encoding="utf-8"))
          PY
      - name: A+B+C truth gate
        run: python tests/spec_coverage.py
      - name: Road car contract
        run: python tests/road_car_contract.py
      - name: Steering model
        run: python tests/driving_model.py
      - name: JavaScript syntax
        run: node --check packs/behavior_pack/scripts/road_car.js
      - name: Negative controls
        run: python tests/negative_controls.py
      - name: One-click package
        run: |
          rm -rf dist staging
          mkdir -p dist staging/bp staging/rp
          cp -R packs/behavior_pack/. staging/bp/
          rm -f staging/bp/scripts/driver_camera.js
          cp -R packs/resource_pack/. staging/rp/
          (cd staging/bp && zip -qr ../../dist/MinecraftLab-RoadCar-BP-1.1.0.mcpack .)
          (cd staging/rp && zip -qr ../../dist/MinecraftLab-RoadCar-RP-1.1.0.mcpack .)
          (cd dist && zip -q MinecraftLab-RoadCar-1.1.0.mcaddon MinecraftLab-RoadCar-BP-1.1.0.mcpack MinecraftLab-RoadCar-RP-1.1.0.mcpack)
          unzip -t dist/MinecraftLab-RoadCar-1.1.0.mcaddon
          sha256sum dist/MinecraftLab-RoadCar-1.1.0.mcaddon > dist/SHA256SUMS.txt
      - name: Upload candidate
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLab-RoadCar-1.1.0
          path: |
            dist/MinecraftLab-RoadCar-1.1.0.mcaddon
            dist/SHA256SUMS.txt
          if-no-files-found: error
