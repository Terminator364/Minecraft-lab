name: Build Minecraft Add-On

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("packs").rglob("*.json"))
          if not files:
              raise SystemExit("No JSON files found")
          for path in files:
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print("OK", path)
          PY

      - name: Build Bedrock packages
        shell: bash
        run: |
          rm -rf dist staging
          mkdir -p dist staging/bp staging/rp
          cp -R packs/behavior_pack/. staging/bp/
          cp -R packs/resource_pack/. staging/rp/

          (
            cd staging/bp
            zip -qr ../../dist/MinecraftLabVehicle_BP.mcpack .
          )
          (
            cd staging/rp
            zip -qr ../../dist/MinecraftLabVehicle_RP.mcpack .
          )
          (
            cd dist
            zip -q MinecraftLab-Vehicle-v0.1.0.mcaddon               MinecraftLabVehicle_BP.mcpack MinecraftLabVehicle_RP.mcpack
          )

          sha256sum dist/MinecraftLab-Vehicle-v0.1.0.mcaddon > dist/SHA256SUMS.txt

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLab-Vehicle-v0.1.0
          path: |
            dist/MinecraftLab-Vehicle-v0.1.0.mcaddon
            dist/SHA256SUMS.txt
          if-no-files-found: error
