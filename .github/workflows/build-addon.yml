name: Build Minecraft Add-On

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vehicle-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          files = sorted(Path("packs").rglob("*.json"))
          if not files:
              raise SystemExit("No JSON files found")
          for path in files:
              with path.open("r", encoding="utf-8") as f:
                  json.load(f)
              print("JSON OK", path)
          PY

      - name: Vehicle contract gate
        run: python tests/vehicle_contract.py

      - name: Anticipation matrix
        run: python tests/anticipation_matrix.py

      - name: Build Bedrock packages
        shell: bash
        run: |
          rm -rf dist staging
          mkdir -p dist staging/bp staging/rp
          cp -R packs/behavior_pack/. staging/bp/
          cp -R packs/resource_pack/. staging/rp/

          (
            cd staging/bp
            zip -qr ../../dist/MinecraftLabRoadCar_BP.mcpack .
          )
          (
            cd staging/rp
            zip -qr ../../dist/MinecraftLabRoadCar_RP.mcpack .
          )
          (
            cd dist
            zip -q MinecraftLab-RoadCar-v0.3.0.mcaddon MinecraftLabRoadCar_BP.mcpack MinecraftLabRoadCar_RP.mcpack
          )

          sha256sum dist/MinecraftLab-RoadCar-v0.3.0.mcaddon > dist/SHA256SUMS.txt
          unzip -t dist/MinecraftLab-RoadCar-v0.3.0.mcaddon

      # Important: GitHub Actions artifacts are themselves ZIP files.
      # Upload only the two mcpack files so the downloaded artifact ZIP is
      # directly a structurally valid mcaddon when renamed .mcaddon.
      - name: Upload direct mcaddon payload
        uses: actions/upload-artifact@v4
        with:
          name: MinecraftLab-RoadCar-v0.3.0-DIRECT
          path: |
            dist/MinecraftLabRoadCar_BP.mcpack
            dist/MinecraftLabRoadCar_RP.mcpack
          if-no-files-found: error
          compression-level: 6

  bds-smoke:
    needs: vehicle-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Official Bedrock Dedicated Server smoke oracle
        id: bds
        continue-on-error: true
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          LINKS_API="https://net-secondary.web.minecraft-services.net/api/v1.0/download/links"

          BDS_URL="$(curl --fail --silent --show-error --location             --connect-timeout 10 --max-time 20 "$LINKS_API" |             python -c 'import json,sys; d=json.load(sys.stdin); print(next(x["downloadUrl"] for x in d["result"]["links"] if x["downloadType"]=="serverBedrockLinux"))')"
          echo "Official BDS URL resolved: $BDS_URL"

          mkdir -p bds
          curl --http1.1 --fail --location             --connect-timeout 10 --max-time 70             --retry 1 --retry-delay 2 --retry-all-errors             --output bds/server.zip "$BDS_URL"

          unzip -q bds/server.zip -d bds
          chmod +x bds/bedrock_server
          cd bds

          sed -i 's/^level-name=.*/level-name=RoadCarTest/' server.properties
          sed -i 's/^online-mode=.*/online-mode=false/' server.properties
          if grep -q '^transport=' server.properties; then
            sed -i 's/^transport=.*/transport=raknet/' server.properties
          else
            echo 'transport=raknet' >> server.properties
          fi

          set +e
          timeout --signal=INT 12s env LD_LIBRARY_PATH=. ./bedrock_server > first_boot.log 2>&1
          FIRST_STATUS=$?
          set -e
          if [ "$FIRST_STATUS" -ne 0 ] && [ "$FIRST_STATUS" -ne 124 ] && [ "$FIRST_STATUS" -ne 130 ]; then
            cat first_boot.log
            exit "$FIRST_STATUS"
          fi
          test -d "worlds/RoadCarTest"

          mkdir -p behavior_packs/MinecraftLabRoadCar_BP
          mkdir -p resource_packs/MinecraftLabRoadCar_RP
          cp -R ../packs/behavior_pack/. behavior_packs/MinecraftLabRoadCar_BP/
          cp -R ../packs/resource_pack/. resource_packs/MinecraftLabRoadCar_RP/

          python - <<'PY'
          import json
          from pathlib import Path
          world = Path("worlds/RoadCarTest")
          (world / "world_behavior_packs.json").write_text(
              json.dumps([{"pack_id":"e7e4d5f8-8f95-4e74-9e90-15e649c01f90","version":[0,3,0]}]),
              encoding="utf-8")
          (world / "world_resource_packs.json").write_text(
              json.dumps([{"pack_id":"6a55a02d-40c3-41a6-8458-189d6d9f51bc","version":[0,3,0]}]),
              encoding="utf-8")
          PY

          set +e
          timeout --signal=INT 12s env LD_LIBRARY_PATH=. ./bedrock_server > pack_boot.log 2>&1
          PACK_STATUS=$?
          set -e
          cat pack_boot.log
          if [ "$PACK_STATUS" -ne 0 ] && [ "$PACK_STATUS" -ne 124 ] && [ "$PACK_STATUS" -ne 130 ]; then
            exit "$PACK_STATUS"
          fi

          if grep -Eiq 'failed to load.*pack|invalid.*manifest|unknown.*component|json.*error|syntax error' pack_boot.log; then
            echo "BDS detected a pack/runtime loading error"
            exit 1
          fi

          echo "BDS_SMOKE_PASS"

      - name: Report BDS oracle outcome
        if: always()
        shell: bash
        run: |
          echo "BDS oracle outcome: ${{ steps.bds.outcome }}"
          echo "BDS oracle conclusion: ${{ steps.bds.conclusion }}"
